# Shared experimental protocol (plan §3). Every run reads its defaults from here;
# a grid entry may override epochs/batch, and the override is recorded in the run's config.yaml.

imgsz: 640
workers: 4
amp: true
# Ultralytics cache='ram' (images decoded + resized to imgsz once) for datasets with large originals: reading 1-2 MB
# JPEGs from /kaggle/input and decoding 2000+ px images every epoch starves the GPU. Applied per dataset (derived
# ids like pcb_bal_v1 included), so every model on one dataset gets the same setting. Ultralytics notes that the RAM
# cache may make runs not bit-identical; seed-to-seed variation is reported anyway. 'disk' would store full-size
# .npy files (~13 GB for PKU-PCB) and is not an option on Kaggle.
cache_ram: [pcb, gc10]

families:
  yolo:            # YOLO11n and all its variants (Ultralytics)
    epochs: 100
    batch: 16
    patience: 0    # 0 disables early stopping in Ultralytics
  rtdetr:          # RT-DETR-l (Ultralytics)
    epochs: 60
    batch: 8
    patience: 0
  frcnn:           # Faster R-CNN R50-FPN v2 (torchvision)
    epochs: 24
    batch: 8
    lr: 0.01       # torchvision reference recipe scaled to batch 8 (0.02 @ 16)
    momentum: 0.9
    weight_decay: 0.0001
    lr_steps: [16, 22]
    warmup_iters: 500
    eval_every: 2  # val COCO-AP every N epochs for checkpoint selection

seeds:
  p1: [0]
  p2: [0, 1, 2]
  p3: [0, 1, 2]
  final: [0, 1, 2, 3, 4]

eval:
  pred_conf: 0.001        # conf threshold for the exported detections (COCO AP needs the full PR curve)
  pred_iou: 0.7           # NMS IoU used for export (Ultralytics val default)
  max_det: 300
  op_conf: 0.25           # operating point for precision / recall / size-recall / image-level metrics (TBD)
  match_iou: 0.5
  # relative-size groups: box_area / image_area. TBD after EDA (plan §1.2) - aim for >=50 test boxes per group.
  rel_bins: [0.0, 0.005, 0.02, 1.0]
  rel_names: [rel_small, rel_medium, rel_large]
  tide: true

# Class-imbalance handling (plan §2.5). Offline, TRAIN split only, seed-fixed; val/test are never touched.
# Dataset ids built on demand from <ds>:
#   <ds>_bal_v1  class-aware augmentation + copy-paste of rare defects (main phase-1 data, §2.5.5)
#   <ds>_aug_v1  class-aware augmentation only (optional ablation: aug vs copy-paste)
#   <ds>_rfs_v1  plain repeat-factor sampling, identical copies (fallback, Appendix A.5)
# Per-dataset switches (geometric ops, copy-paste on/off) live in datasets.yaml -> balance.
# Bump the version suffix (v2, ...) whenever these values change, so old runs stay traceable.
balance:
  seed: 42
  t: 0.2                    # repeat-factor threshold: r_c = min(cap, max(1, sqrt(t / f_c))), f_c = image share of c
  cap: 4.0
  max_increase: 0.5         # generated images <= 50% of the original train images
  rare_ratio: 0.333         # rare class: < rare_ratio x boxes of the largest class (original train)
  target_ratio: 0.333       # copy-paste fills rare classes up to this x images of the largest class
  imbalance_threshold: 3.0  # mode "auto": balance only if max/min boxes per class >= this
  unstable_test_boxes: 10   # per-class AP flagged "unstable" below this many test boxes
  copy_paste:
    margin: 6               # background ring (px) around a pasted defect, feathered into the target
    max_paste: 3            # defects pasted per generated image
    max_rel_area: 0.25      # never paste defects covering > 25% of the image (e.g. NEU crazing)
    gap: 4                  # min px between a pasted box and existing boxes
  photometric:              # applied to every generated image (plan §2.5.5)
    contrast: [0.8, 1.2]
    brightness: 20
    gamma: [0.8, 1.25]
    p_gamma: 0.5
    noise_sigma: [2, 6]
    p_noise: 0.3
    p_blur: 0.2

# Tiling (training data) and sliced inference (SAHI-style, Akyon et al. 2022) for large images (plan §5.1).
# A dataset id "<ds>_t<size>" (e.g. pcb_t640) is built automatically from <ds>: train/val are cut into tiles,
# test stays the ORIGINAL full images, so tiled runs are scored on the same test set as everything else.
tiling:
  overlap: 0.2              # fraction of the tile size shared by neighbouring tiles
  min_visibility: 0.5       # keep a clipped box only if >= this fraction of its area lies inside the tile
  keep_empty: 0.1           # fraction of defect-free tiles kept in train/val (background examples)
sahi:
  tile: 640
  overlap: 0.2
  full_image: true          # also predict on the whole (resized) image, as SAHI's standard prediction
  merge_iou: 0.5            # class-wise NMS IoU when merging tile + full-image detections
  batch: 16

benchmark:
  warmup: 50
  iters: 200
  half: true              # FPS reported in FP16 (FP32 also measured)

smoke:                    # --smoke: pipeline check on a tiny budget
  epochs: 1
  fraction: 0.1

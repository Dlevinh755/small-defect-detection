# Large-image track (plan §5.1 "tăng imgsz / SAHI") for PCB and GC10, where defects shrink when resized to 640.
# Every row is scored on the same ORIGINAL full test images.
#   rows 1-2: SAHI-style sliced inference on the phase-1 checkpoints (trained on <ds>_bal_v1; no training)
#   row 3:    sliced inference on the phase-2 A0 checkpoint (original data, seed 0; needs the ablation run first -
#             in parallel sessions it may fail once and is retried by the aggregate session)
#   row 4:    train on 640x640 tiles of the ORIGINAL data (<ds>_t640, built automatically) + sliced inference
# Compare row 3/4 with p2_<ds>_yolo11n_A0_s0 and rows 1-2 with p1_<ds>_bal_v1_yolo11n_{base,p2}_s0.
phase: p2t
datasets: [pcb, gc10]
seeds: [0]
runs:
  - {model: yolo11n, variant: base, infer: sliced, reuse_phase: p1, data_suffix: _bal_v1}
  - {model: yolo11n, variant: p2, infer: sliced, reuse_phase: p1, data_suffix: _bal_v1}
  - {model: yolo11n, variant: A0, infer: sliced, reuse_phase: p2}
  - {model: yolo11n, variant: A0, infer: sliced, data_suffix: _t640}

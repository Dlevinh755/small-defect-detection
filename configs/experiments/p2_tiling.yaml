# Large-image track (plan §5.1 "tăng imgsz / SAHI"), for datasets whose defects shrink when resized to 640.
# Every row is scored on the same ORIGINAL full test images as phase 1; compare with the phase-1 yolo11n runs.
#   rows 1-2: sliced inference only, re-using the phase-1 checkpoints (no training, minutes per dataset)
#   row 3:    train on 640x640 tiles of the balanced data (<ds>_bal_v1_t640, built automatically) + sliced inference
phase: p2t
datasets: [pcb, gc10]
data_suffix: _bal_v1          # same train data as phase 1 (reuse_phase looks up p1_<ds>_bal_v1_...)
seeds: [0]
runs:
  - {model: yolo11n, variant: base, infer: sliced, reuse_phase: p1}
  - {model: yolo11n, variant: p2, infer: sliced, reuse_phase: p1}
  - {model: yolo11n, variant: base, infer: sliced, data_suffix: _bal_v1_t640}
